<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1000" height="720" fill="#f3f4f6"/>
  <rect x="20" y="20" width="960" height="680" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>

  <!-- top bar -->
  <line x1="20" y1="90" x2="980" y2="90" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="60" font-size="22" font-weight="700" fill="#111827">AvtoTrg</text>
  <text x="400" y="60" font-size="13" fill="#374151">Oglasi</text>
  <text x="480" y="60" font-size="13" fill="#374151">Prodajalci</text>
  <text x="900" y="60" font-size="13" fill="#374151">Janez Novak</text>
  <text x="960" y="60" font-size="13" fill="#2563eb" text-anchor="end">Odjava</text>
  <text x="980" y="130" font-size="12" fill="#9ca3af" text-anchor="end">WF-04 · Detajl oglasa</text>

  <!-- back link -->
  <text x="50" y="125" font-size="13" fill="#2563eb">← Nazaj na oglase</text>

  <!-- title + status -->
  <text x="50" y="175" font-size="24" font-weight="700" fill="#111827">Volkswagen Golf 2.0 TDI</text>
  <rect x="430" y="155" width="70" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="12"/>
  <text x="465" y="172" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">aktivni</text>

  <!-- left column: specs -->
  <rect x="50" y="210" width="530" height="470" fill="#fafafa" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="70" y="240" font-size="14" font-weight="600" fill="#111827">Podatki o vozilu</text>

  <text x="70" y="280" font-size="12" fill="#6b7280">Znamka</text>
  <text x="200" y="280" font-size="13" fill="#111827">Volkswagen</text>

  <text x="70" y="315" font-size="12" fill="#6b7280">Model</text>
  <text x="200" y="315" font-size="13" fill="#111827">Golf</text>

  <text x="70" y="350" font-size="12" fill="#6b7280">Letnik</text>
  <text x="200" y="350" font-size="13" fill="#111827">2019</text>

  <text x="70" y="385" font-size="12" fill="#6b7280">Prevoženo</text>
  <text x="200" y="385" font-size="13" fill="#111827">87.500 km</text>

  <text x="70" y="420" font-size="12" fill="#6b7280">Gorivo</text>
  <text x="200" y="420" font-size="13" fill="#111827">dizel</text>

  <text x="70" y="455" font-size="12" fill="#6b7280">Menjalnik</text>
  <text x="200" y="455" font-size="13" fill="#111827">ročni</text>

  <line x1="70" y1="480" x2="560" y2="480" stroke="#e5e7eb" stroke-width="1"/>
  <text x="70" y="510" font-size="12" fill="#6b7280">Opis</text>
  <rect x="70" y="520" width="490" height="140" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" rx="4"/>
  <text x="85" y="545" font-size="12" fill="#6b7280">Prvi lastnik, servisirano pri pooblaščenem</text>
  <text x="85" y="565" font-size="12" fill="#6b7280">serviserju. Zimske in letne pnevmatike,</text>
  <text x="85" y="585" font-size="12" fill="#6b7280">neprekušen, garažno parkiran.</text>

  <!-- right column: price + seller + offer form -->
  <rect x="620" y="210" width="340" height="470" fill="#fafafa" stroke="#d1d5db" stroke-width="1" rx="6"/>
  <text x="640" y="245" font-size="12" fill="#6b7280">Cena</text>
  <text x="640" y="280" font-size="28" font-weight="700" fill="#111827">12.500 €</text>

  <text x="640" y="315" font-size="12" fill="#6b7280">Prodajalec</text>
  <text x="640" y="340" font-size="14" fill="#2563eb" text-decoration="underline">Avtohiša Novak</text>
  <text x="640" y="358" font-size="11" fill="#6b7280">Ljubljana · avtohiša</text>

  <line x1="640" y1="380" x2="940" y2="380" stroke="#e5e7eb" stroke-width="1"/>

  <!-- offer form -->
  <text x="640" y="410" font-size="14" font-weight="600" fill="#111827">Oddaj ponudbo</text>

  <text x="640" y="440" font-size="12" fill="#374151">Znesek (EUR)</text>
  <rect x="640" y="450" width="280" height="32" fill="#ffffff" stroke="#9ca3af" stroke-width="1" rx="4"/>
  <text x="652" y="471" font-size="13" fill="#9ca3af">12000</text>

  <text x="640" y="510" font-size="12" fill="#374151">Sporočilo</text>
  <rect x="640" y="520" width="280" height="70" fill="#ffffff" stroke="#9ca3af" stroke-width="1" rx="4"/>
  <text x="652" y="542" font-size="12" fill="#9ca3af">Ponujam 12.000 €, prevzem</text>
  <text x="652" y="558" font-size="12" fill="#9ca3af">v roku enega tedna.</text>

  <rect x="640" y="610" width="280" height="38" fill="#2563eb" rx="4"/>
  <text x="780" y="634" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Pošlji ponudbo</text>

  <!-- annotation -->
  <text x="980" y="640" font-size="11" fill="#9ca3af" font-style="italic" text-anchor="end">↳ US-05</text>
</svg>
